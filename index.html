  company:  "Riverside Insights",

  resume:   "Andy_Trus_Resume_RiversideInsights.pdf",
  year:     "2026",

  eyebrow: "PRODUCT DIRECTOR, BEHAVIORAL & MENTAL HEALTH  ·  RIVERSIDE INSIGHTS",

  headline: {
    line1: "DESSA measures the strengths. Move This World builds them.",
    line2: "I've built what measures, what teaches, and what connects them."
  },

  heroSub: "Making them one assessment-led system, with one strategy, one operating plan, and a number to answer for, is the work ahead. In 14 years of building EdTech products, I've repositioned products for new markets, been accountable for retention and growth on a $100M+ platform, and four times started a role with no playbook. I also share the idea behind DESSA: start with what each student can already do, then build from there. It's the idea behind the developmental math product I built from scratch.",

  stats: [
    { value: "$100M+", label: "YEARLY REVENUE PLATFORM WHERE I LED PRODUCT" },
    { value: "21%",    label: "STATISTICS LINE GROWTH IN 3 YEARS, OUTPERFORMING OTHER LINES" },
    { value: "4",      label: "TIMES I'VE STARTED A ROLE THAT DIDN'T EXIST AND DEFINED HOW THE WORK RUNS" },
    { value: "~$500K", label: "YEARLY PRODUCT BUDGET I MANAGED" }
  ],

  whyTitle: "Why Riverside and why Behavioral & Mental Health",
  whyBullets: [
    "<strong>Experience: Building for Students Who Need It Most</strong> A lot of Ed-Tech is built for the student who will succeed no matter what teacher or technology is in front of them. My work hasn't been. I built an assessment line from scratch that placed over 150K students into the right math course, a developmental math product for students who'd been told they were bad at math, and Class Insights, which turned performance data into action for instructors. Today I use psychometrics to find where students struggle most.",
    "<strong>Personal: Raising an Autistic Child</strong> I'm the parent of a child with autism, and I've seen up close what families go through around learning, emotional regulation, and finding the right support. I'm not a clinician, but I want to build tools that recognize a child's strengths and help the adults around them support the whole child.",
    "<strong>Market: Rules Being Written Now</strong> This market is changing fast. Illinois law requires districts to offer annual mental health screening in grades 3–12 starting in 2027–28, once the state provides a free tool, and SEL screeners don't count toward it. New federal awards are aimed at hiring school psychologists, and the category itself is moving from SEL toward life skills and whole-learner support. Districts are still piecing together separate tools. One system that connects screening, support, and progress is the opportunity, but competitors already sell versions of that, so it has to work better, not just be bundled.",
    "<strong>Fit: Owning a Product Line</strong> It's where I bring the most value, and it's what I've done for most of my career: first the Statistics line, then WebAssign as Product Director. I owned the roadmap and go-to-market with sales and marketing, and answered for retention and growth, while staying close to customers and coaching product leaders."
  ],

  bringTitle: "What I'd bring to the role",
  cards: [
    { title: "A GM mindset: accountable for retention, growth, and budget",
      body: "I run a product line like a business, balancing customer needs, budget, and company goals. As Product Director, I owned vision, strategy, and overall success for WebAssign, a $100M+ a year platform, with 10% unit growth over two years, ahead of forecast. On the Statistics line, I managed about $500K a year and grew the line 21% in three years. At McGraw Hill, I launched grading capabilities that addressed a source of churn worth millions of dollars." },
    { title: "Planning how separate products become one customer experience",
      body: "I oversaw a 40+ person cross-functional team on the strategy and planning to fold a $15M+ Chemistry offering into the unified WebAssign Math and Science platform, aimed at reducing churn and the cost of maintaining two similar products. It meant aligning technology, content, and customer needs, and planning how to retire a standalone product. That's the same challenge as bringing DESSA and Move This World together without losing what makes each valuable." },
    { title: "Reshaping products around what the market tells us",
      body: "At WebAssign, I re-imagined Mastery Learning to win new customer segments, taking a cross-functional team from content guidelines through go-to-market to a successful new offering. On the Statistics line, a textbook revised around market feedback launched under budget and grew 40%. I also reworked how product, engineering, and sales collaborate on go-to-market, so launches were more customer-centered and tied to business results." },
    { title: "Four times, I've started a role that didn't exist and led the people to run it",
      body: "At Lulu, WebAssign, Cengage, and now McGraw Hill, I started without a playbook. As Director, I was promoted into a newly created role and set up new ways to discover customer needs and collaborate. At McGraw Hill, I was hired to build a new product team, and I defined the acquisition, engagement, and retention measures that became the standard across K-12 product lines. I manage two PMs across four engineering teams, work with content authors and vendors, and shipped an AI tool that saved $2.75M in vendor content review costs." }
  ],


  questions: [
    "Federal money is now aimed at hiring credentialed school mental health providers, while universal screening finds more students who need help than those providers can see. Where does BMH create the most value in that gap: helping decide which students the scarce clinician sees first, or what teachers can do before a referral is needed? And what would it have to prove to earn a place in budgets that pay for people?",
    "State rules and funding lines increasingly separate mental health from SEL, while the category is moving from SEL toward life skills and whole-learner support. Is BMH a bet that districts will settle on one vocabulary, or a system built to be bought under whichever label a mandate or budget line uses?",
    "Illinois requires districts to offer annual mental health screening in grades 3–12 starting in 2027–28, once the state provides a free tool, while a January 2026 Manhattan Institute brief argues for prohibiting it in schools. If screening policy can swing by state and by year, what do districts keep buying either way: the screen, the instruction, or the evidence of progress over time?",
    "Move This World joined Riverside in March, and the connected system launched in August, less than five months later. In an integration that fast, which seams does the customer actually feel (login, data, pricing, support), and which can stay two products behind the scenes? What gets sequenced first, and what should stay separate on purpose?"
  ],


  linkedin: "linkedin.com/in/andy-trus",
  email: "trus.productguy@gmail.com",
  phone: "301-461-6166"
};

<style>
  :root {
    --ink:      #16324A;
    --river:    #2C6E7F;
    --sand:     #F4EFE4;
    --gold:     #C68A34;
    --charcoal: #2A2A28;
    --white:    #FFFFFF;
    --line:     rgba(22,50,74,0.14);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--sand);
    color: var(--charcoal);
    font-family: 'Source Sans 3', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: 'Fraunces', serif; margin: 0; color: var(--ink); }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px; }

  /* ---- river line divider ---- */
  .river-line { width: 100%; height: 28px; margin: 0 auto; display: block; }
  .river-line path { fill: none; stroke: var(--gold); stroke-width: 2; opacity: 0.55; }

  /* ---- header ---- */
  header { padding: 40px 0 0; }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; letter-spacing: 0.12em; color: var(--river);
    margin-bottom: 22px;
  }

  /* ---- hero ---- */
  .hero { padding: 8px 0 36px; }
  .hero h1 {
    font-size: clamp(34px, 5.4vw, 56px);
    line-height: 1.1;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .hero h1 em { font-style: italic; color: var(--river); }
  .hero-sub {
    margin-top: 22px; font-size: 19px; line-height: 1.6;
    max-width: 780px; color: var(--charcoal);
  }

  /* ---- stats ---- */
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr);
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    margin: 30px 0 44px;
  }
  .stat { padding: 22px 16px; text-align: left; border-left: 1px solid var(--line); }
  .stat:first-child { border-left: none; }
  .stat-value { font-family: 'Fraunces', serif; font-size: clamp(19px, 2.6vw, 26px); color: var(--ink); font-weight: 500; }
  .stat-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.06em;
    color: var(--river); margin-top: 6px; text-transform: uppercase;
  }

  /* ---- why ---- */
  .why { padding: 8px 0 46px; }
  .why h2 { font-size: 26px; font-weight: 500; margin-bottom: 16px; }
  .why-list { margin: 0; padding: 0; list-style: none; max-width: 820px; }
  .why-list li {
    position: relative; padding: 12px 0 12px 24px; font-size: 17px; line-height: 1.65;
    border-bottom: 1px solid var(--line);
  }
  .why-list li:first-child { border-top: 1px solid var(--line); }
  .why-list li::before {
    content: "\2013"; position: absolute; left: 0; color: var(--gold); font-weight: 600;
  }

  /* ---- cards ---- */
  .bring { padding: 10px 0 50px; }
  .bring h2 { font-size: 26px; font-weight: 500; margin-bottom: 24px; }
  .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .card {
    background: var(--white); border: 1px solid var(--line); border-radius: 6px;
    padding: 26px 24px; border-top: 3px solid var(--gold);
  }
  .card h3 { font-size: 18.5px; font-weight: 500; margin-bottom: 10px; line-height: 1.3; }
  .card p { font-size: 15.5px; line-height: 1.62; color: var(--charcoal); margin: 0; }

  /* ---- questions ---- */
  .questions { padding: 10px 0 50px; }
  .questions h2 { font-size: 26px; font-weight: 500; margin-bottom: 22px; }
  .q-item {
    display: flex; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--line);
  }
  .q-item:first-child { border-top: 1px solid var(--line); }
  .q-num { font-family: 'IBM Plex Mono', monospace; color: var(--gold); font-size: 14px; padding-top: 2px; min-width: 20px; }
  .q-text { font-size: 16.5px; line-height: 1.6; }

  /* ---- footer ---- */
  footer {
    padding: 40px 0 60px; border-top: 1px solid var(--line); margin-top: 10px;
  }
  .foot-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 18px; }
  .foot-name { font-family: 'Fraunces', serif; font-size: 20px; color: var(--ink); }
  .foot-links a {
    color: var(--river); text-decoration: none; font-size: 14.5px; margin-left: 20px;
  }
  .foot-links a:first-child { margin-left: 0; }
  .resume-btn {
    display: inline-block; background: var(--ink); color: var(--white) !important;
    padding: 10px 20px; border-radius: 4px; font-weight: 500;
  }
  .resume-btn:hover { background: var(--river); }

  a:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  @media (max-width: 680px) {
    .card-grid { grid-template-columns: 1fr; }
    .stats { grid-template-columns: 1fr; }
    .stat { border-left: none; border-top: 1px solid var(--line); }
    .stat:first-child { border-top: none; }
    .foot-row { flex-direction: column; align-items: flex-start; }
    .foot-links a { margin-left: 0; margin-right: 18px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
  </header>

  <section class="hero">
    <h1 id="headline"></h1>
    <p class="hero-sub" id="heroSub"></p>
  </section>

  <svg class="river-line" viewBox="0 0 900 28" preserveAspectRatio="none"><path d="M0,14 C120,2 180,26 300,14 C420,2 480,26 600,14 C720,2 780,26 900,14"/></svg>

  <section class="stats" id="stats"></section>

  <section class="why">
    <h2 id="whyTitle"></h2>
    <div id="why"></div>
  </section>

  <section class="bring">
    <h2 id="bringTitle"></h2>
    <div class="card-grid" id="cards"></div>
  </section>

  <svg class="river-line" viewBox="0 0 900 28" preserveAspectRatio="none"><path d="M0,14 C120,26 180,2 300,14 C420,26 480,2 600,14 C720,26 780,2 900,14"/></svg>

  <section class="questions">
    <h2>Questions I'm sitting with</h2>
    <div id="questions"></div>
  </section>

  <footer>
    <div class="foot-row">
      <div class="foot-name" id="footName"></div>
      <div class="foot-links" id="footLinks"></div>
    </div>
  </footer>
</div>

<script>
  document.title = "Andy Trus \u2014 " + CONFIG.role;
  document.getElementById('eyebrow').textContent = CONFIG.eyebrow;

  document.getElementById('headline').innerHTML =
    CONFIG.headline.line1 + " <em>" + CONFIG.headline.line2 + "</em>";

  document.getElementById('heroSub').textContent = CONFIG.heroSub;

  document.getElementById('stats').innerHTML = CONFIG.stats.map(s => `
    <div class="stat">
      <div class="stat-value">${s.value}</div>
      <div class="stat-label">${s.label}</div>
    </div>
  `).join('');

  document.getElementById('whyTitle').textContent = CONFIG.whyTitle;
  document.getElementById('why').innerHTML = '<ul class="why-list">' +
    CONFIG.whyBullets.map(b => `<li>${b}</li>`).join('') +
    '</ul>';

  document.getElementById('bringTitle').textContent = CONFIG.bringTitle;
  document.getElementById('cards').innerHTML = CONFIG.cards.map(c => `
    <div class="card">
      <h3>${c.title}</h3>
      <p>${c.body}</p>
    </div>
  `).join('');

  document.getElementById('questions').innerHTML = CONFIG.questions.map((q,i) => `
    <div class="q-item">
      <div class="q-num">0${i+1}</div>
      <div class="q-text">${q}</div>
    </div>
  `).join('');

  document.getElementById('footName').textContent = "Andy Trus \u00B7 " + CONFIG.year;
  document.getElementById('footLinks').innerHTML = `
    <a href="mailto:${CONFIG.email}">${CONFIG.email}</a>
    <a href="https://${CONFIG.linkedin}">${CONFIG.linkedin}</a>
    <a class="resume-btn" href="${CONFIG.resume}">View R\u00e9sum\u00e9</a>
  `;
</script>
</body>
</html>
