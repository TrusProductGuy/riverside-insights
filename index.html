<style>
  :root {
    --ink:      #16324A;
    --river:    #2C6E7F;
    --sand:     #F4EFE4;
    --gold:     #C68A34;
    --charcoal: #2A2A28;
    --white:    #FFFFFF;
    --line:     rgba(22,50,74,0.14);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--sand);
    color: var(--charcoal);
    font-family: 'Source Sans 3', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: 'Fraunces', serif; margin: 0; color: var(--ink); }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .wrap { max-width: 900px; margin: 0 auto; padding: 0 28px; }

  /* ---- river line divider ---- */
  .river-line { width: 100%; height: 28px; margin: 0 auto; display: block; }
  .river-line path { fill: none; stroke: var(--gold); stroke-width: 2; opacity: 0.55; }

  /* ---- header ---- */
  header { padding: 40px 0 0; }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; letter-spacing: 0.12em; color: var(--river);
    margin-bottom: 22px;
  }

  /* ---- hero ---- */
  .hero { padding: 8px 0 36px; }
  .hero h1 {
    font-size: clamp(34px, 5.4vw, 56px);
    line-height: 1.1;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .hero h1 em { font-style: italic; color: var(--river); }
  .hero-sub {
    margin-top: 22px; font-size: 19px; line-height: 1.6;
    max-width: 640px; color: var(--charcoal);
  }

  /* ---- stats ---- */
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr);
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    margin: 30px 0 44px;
  }
  .stat { padding: 22px 16px; text-align: left; border-left: 1px solid var(--line); }
  .stat:first-child { border-left: none; }
  .stat-value { font-family: 'Fraunces', serif; font-size: clamp(19px, 2.6vw, 26px); color: var(--ink); font-weight: 500; }
  .stat-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.06em;
    color: var(--river); margin-top: 6px; text-transform: uppercase;
  }

  /* ---- why ---- */
  .why { padding: 8px 0 46px; }
  .why h2 { font-size: 26px; font-weight: 500; margin-bottom: 16px; }
  .why-list { margin: 0; padding: 0; list-style: none; max-width: 700px; }
  .why-list li {
    position: relative; padding: 12px 0 12px 24px; font-size: 17px; line-height: 1.65;
    border-bottom: 1px solid var(--line);
  }
  .why-list li:first-child { border-top: 1px solid var(--line); }
  .why-list li::before {
    content: "\2013"; position: absolute; left: 0; color: var(--gold); font-weight: 600;
  }

  /* ---- cards ---- */
  .bring { padding: 10px 0 50px; }
  .bring h2 { font-size: 26px; font-weight: 500; margin-bottom: 24px; }
  .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .card {
    background: var(--white); border: 1px solid var(--line); border-radius: 6px;
    padding: 26px 24px; border-top: 3px solid var(--gold);
  }
  .card h3 { font-size: 18.5px; font-weight: 500; margin-bottom: 10px; line-height: 1.3; }
  .card p { font-size: 15.5px; line-height: 1.62; color: var(--charcoal); margin: 0; }

  /* ---- questions ---- */
  .questions { padding: 10px 0 50px; }
  .questions h2 { font-size: 26px; font-weight: 500; margin-bottom: 22px; }
  .q-item {
    display: flex; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--line);
  }
  .q-item:first-child { border-top: 1px solid var(--line); }
  .q-num { font-family: 'IBM Plex Mono', monospace; color: var(--gold); font-size: 14px; padding-top: 2px; min-width: 20px; }
  .q-text { font-size: 16.5px; line-height: 1.6; }

  .foot-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 18px; }
  .foot-name { font-family: 'Fraunces', serif; font-size: 20px; color: var(--ink); }
  .foot-links a {

  .foot-links a:first-child { margin-left: 0; }
  .resume-btn {
    display: inline-block; background: var(--ink); color: var(--white) !important;
    padding: 10px 20px; border-radius: 4px; font-weight: 500;
  }
  .resume-btn:hover { background: var(--river); }

  a:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  @media (max-width: 680px) {
    .card-grid { grid-template-columns: 1fr; }
    .stats { grid-template-columns: 1fr; }
    .stat { border-left: none; border-top: 1px solid var(--line); }
    .stat:first-child { border-top: none; }
    .foot-row { flex-direction: column; align-items: flex-start; }
    .foot-links a { margin-left: 0; margin-right: 18px; }
  }

<div class="wrap">

  <section class="stats" id="stats"></section>

  <section class="why">
    <h2 id="whyTitle"></h2>

<script>
  document.title = "Andy Trus \u2014 " + CONFIG.role;
  document.getElementById('eyebrow').textContent = CONFIG.eyebrow;

  document.getElementById('headline').innerHTML =
    CONFIG.headline.line1 + " <em>" + CONFIG.headline.line2 + "</em>";

  document.getElementById('heroSub').textContent = CONFIG.heroSub;

  document.getElementById('stats').innerHTML = CONFIG.stats.map(s => `
    <div class="stat">
      <div class="stat-value">${s.value}</div>
      <div class="stat-label">${s.label}</div>
    </div>
  `).join('');

  document.getElementById('whyTitle').textContent = CONFIG.whyTitle;
  document.getElementById('why').innerHTML = '<ul class="why-list">' +
    CONFIG.whyBullets.map(b => `<li>${b}</li>`).join('') +

  document.getElementById('cards').innerHTML = CONFIG.cards.map(c => `
    <div class="card">
      <h3>${c.title}</h3>
      <p>${c.body}</p>
    </div>
  `).join('');

  document.getElementById('questions').innerHTML = CONFIG.questions.map((q,i) => `
    <div class="q-item">
      <div class="q-num">0${i+1}</div>
      <div class="q-text">${q}</div>
    </div>
  `).join('');

  document.getElementById('footName').textContent = "Andy Trus \u00B7 " + CONFIG.year;
  document.getElementById('footLinks').innerHTML = `
    <a href="mailto:${CONFIG.email}">${CONFIG.email}</a>
    <a href="https://${CONFIG.linkedin}">${CONFIG.linkedin}</a>
    <a class="resume-btn" href="${CONFIG.resume}">View R\u00e9sum\u00e9</a>
  `;
